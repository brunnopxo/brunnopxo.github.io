name: Publish site

# Publica a cada push na `main`: renderiza com Quarto e empurra o resultado
# para a branch `gh-pages`, de onde o GitHub Pages serve. Continua dando para
# disparar à mão em Actions → Publish site → Run workflow.
#
# Atenção: só vai ao ar o que estiver commitado. O PDF do CV é versionado em
# assets/, mas a fonte LaTeX (_cv/) não é — editar o .tex sem recompilar e
# commitar o PDF deixa o site servindo a versão antiga.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# As actions são fixadas por SHA, não por tag. Uma tag como `v2` é móvel: quem
# controla o repositório da action pode reapontá-la a qualquer momento, e o
# código novo rodaria aqui com a permissão `contents: write` acima. O SHA é
# imutável. Para atualizar, resolva a tag e troque o SHA à mão:
#   gh api repos/actions/checkout/commits/v4 --jq .sha
#   gh api repos/quarto-dev/quarto-actions/commits/v2 --jq .sha
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
