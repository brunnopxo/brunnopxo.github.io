name: Publish site

# Publica a cada push na `main`: renderiza com Quarto e empurra o resultado
# para a branch `gh-pages`, de onde o GitHub Pages serve. Continua dando para
# disparar à mão em Actions → Publish site → Run workflow.
#
# Atenção: só vai ao ar o que estiver commitado. O PDF do CV é versionado em
# assets/, mas a fonte LaTeX (_cv/) não é — editar o .tex sem recompilar e
# commitar o PDF deixa o site servindo a versão antiga.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
